# Acesso SSH da VPS (37.27.213.38 / beauty.iluminatto.online).
# Instalado em /etc/ssh/sshd_config.d/00-access.conf
#
# ATENÇÃO: o sshd usa o PRIMEIRO valor que encontra para cada diretiva, e este
# drop-in é incluído antes das diretivas de /etc/ssh/sshd_config. Ou seja: os
# valores daqui é que valem. Mantenha este arquivo e o sshd_config coerentes.
#
# Até 2026-11-25 este arquivo liberava PasswordAuthentication yes e
# PermitRootLogin yes (root com senha exposto no IP público).
#
# Agora: acesso apenas pelo usuário `deploy`, somente com chave.
# Console de emergência: console web/serial do provedor (Hetzner), com root.

PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
MaxAuthTries 3
UsePAM yes
